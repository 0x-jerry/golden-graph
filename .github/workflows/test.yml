name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup bun
        uses: 0x-jerry/workflows/actions/setup-js@main

      - name: Install dependencies
        run: bun install

      - name: Force Rebuild Canvas
        run: cd packages/renderer/node_modules/canvas && bun run install

      - name: Run tests
        run: bun run test
